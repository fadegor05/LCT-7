events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любые пути отдаём в index.html (роуты /api ведёт Traefik на backend)
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
