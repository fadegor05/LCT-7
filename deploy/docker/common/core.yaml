services:
  backend:
    image: ${REGISTRY}/backend:${BACKEND_TAG:-latest}
    build: ./backend
    env_file: .env
    environment:
      # Тег образа нужен самому приложению (GET /api/version), а не только compose при pull.
      BACKEND_TAG: ${BACKEND_TAG:-latest}
      # backend читает весь .env через env_file; ключ LLM не должен до него доходить
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
      # Снимки со стрима по расписанию; на стенде включены (по умолчанию выключено в настройках)
      STREAM__ENABLED: ${STREAM__ENABLED:-true}
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.priority=20
      - traefik.http.services.backend.loadbalancer.server.port=8000
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
        required: false
    volumes:
      - storage_data:/data/storage
    restart: always

  ml:
    image: ${REGISTRY}/ml:${ML_TAG:-latest}
    build: ./ml
    environment:
      WEIGHTS: /weights/mocs_m_best.pt
      MAX_UPLOAD_BYTES: 20971520
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ml_weights:/weights:ro
    networks:
      - web
    restart: always

  frontend:
    container_name: frontend
    init: true
    image: ${REGISTRY}/frontend:${FRONTEND_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      - traefik.enable=true
      # priority=1 — фронт ловит всё, что не перехватил backend (/api, priority=20)
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.frontend.priority=1

networks:
  web:
    driver: bridge
