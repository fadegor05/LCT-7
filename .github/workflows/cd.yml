# Деплой стенда в Yandex Cloud (ВМ veha-stand).
#
# Образы собираются здесь, а не на ВМ: из сети Yandex Cloud недоступны Docker Hub,
# download.pytorch.org и registry.npmjs.org, так что сборка ml и frontend на ВМ
# не проходит. ВМ только тянет готовые образы из GHCR и перезапускает compose.
#
# Триггеры: push в main и ручной запуск. Job `deploy` выполняется, только когда
# в репозитории выставлена переменная DEPLOY_ENABLED=true и заведены секреты
# (список — deploy/README.md, раздел «Автоматический деплой»).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_images:
        description: Публиковать образы в GHCR (без этого деплой не запускается)
        type: boolean
        default: true
      tag:
        description: 'Доп. тег для образов (кроме sha и latest), например v0.1.0'
        type: string
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # На push входов нет, поэтому публикуем всегда; при ручном запуске — по флагу.
  PUSH_IMAGES: ${{ github.event_name == 'push' || inputs.push_images }}

jobs:
  build-push:
    name: образ · ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ml]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа приводится к нижнему регистру самим action:
      # fadegor05/LCT-7 -> ghcr.io/fadegor05/lct-7/<service>
      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: деплой на стенд
    needs: build-push
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.push_images)
    permissions:
      contents: read
      packages: read
    environment:
      name: prod
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # Каталог стенда на ВМ: там лежит .env, который в git не попадает.
      DEPLOY_DIR: /opt/veha
    steps:
      - uses: actions/checkout@v4

      - name: SSH-ключ деплоя
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Compose-файлы и makefile едут из того же коммита, что и образы:
      # иначе на ВМ могут оказаться сервисы, которых нет в свежих образах.
      - name: Выложить compose-файлы
        run: |
          tar czf - makefile deploy \
            | ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "tar xzf - -C $DEPLOY_DIR"

      # GITHUB_TOKEN живёт только пока идёт job — отдельный PAT на ВМ не нужен.
      # Пароль передаётся через stdin, в командную строку и логи он не попадает.
      - name: Обновить стенд
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            cd $DEPLOY_DIR
            sed -i 's|^BACKEND_TAG=.*|BACKEND_TAG=$TAG|;s|^FRONTEND_TAG=.*|FRONTEND_TAG=$TAG|;s|^ML_TAG=.*|ML_TAG=$TAG|' deploy/versions.env
            make deploy-tunnel
            docker image prune -f
            docker logout ghcr.io"

      - name: Смоук после деплоя
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://$DEPLOY_HOST/api/health" && exit 0
            sleep 5
          done
          echo "стенд не отвечает на /api/health" && exit 1
