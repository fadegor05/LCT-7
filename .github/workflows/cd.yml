      #   run: |
      #     sed -i "s|^BACKEND_TAG=.*|BACKEND_TAG=sha-${GITHUB_SHA::7}|"  deploy/versions.env
      #     sed -i "s|^FRONTEND_TAG=.*|FRONTEND_TAG=sha-${GITHUB_SHA::7}|" deploy/versions.env
      #
