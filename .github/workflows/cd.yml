      #   DEPLOY_PORT      — порт SSH (22 по умолчанию)
      #   DEPLOY_USER      — пользователь
      #   DEPLOY_SSH_KEY   — приватный ключ (ed25519), без пароля
      #   GHCR_PULL_TOKEN  — PAT с read:packages, если пакеты приватные
