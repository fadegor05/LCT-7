# Сборка образов для стенда в Yandex Cloud (ВМ veha-stand).
#
# Образы собираются здесь, а не на ВМ: из сети Yandex Cloud недоступны Docker Hub,
# download.pytorch.org и registry.npmjs.org, так что ml и frontend на ВМ не собрать.
#
# Доставки отсюда на ВМ нет: входящие соединения с зарубежных адресов (а раннеры
# GitHub — за рубежом) до ВМ не доходят, а api.github.com недоступен с ВМ, так что
# и self-hosted runner не работает. ВМ сама забирает обновления: последним job'ом
# публикуется образ-«посылка» deploy с makefile и deploy/, по его появлению
# таймер на ВМ выкатывает коммит (deploy/autodeploy/, deploy/README.md).
#
# Реестр — Yandex Container Registry, а не GHCR: с ВМ GitHub доступен с перебоями
# (ghcr.io отвечал на 7 запросов из 20), а cr.yandex стабилен и изнутри облака, и
# из-за рубежа, откуда пушат раннеры. На чтение реестр открыт всем (роль
# container-registry.images.puller у system:allUsers), ВМ тянет без токена.
# Настройка: переменная YC_REGISTRY_ID и секрет YC_SA_JSON_KEY — deploy/README.md.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_images:
        description: Публиковать образы в реестр (без этого стенд не обновится)
        type: boolean
        default: true
      tag:
        description: 'Доп. тег для образов (кроме sha и latest), например v0.1.0'
        type: string
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  # Пока реестр не настроен, имя-заглушка: сборка проходит, публикация выключена.
  REGISTRY: cr.yandex/${{ vars.YC_REGISTRY_ID || 'not-configured' }}
  # На push входов нет, поэтому публикуем всегда; при ручном запуске — по флагу.
  PUSH_IMAGES: ${{ (github.event_name == 'push' || inputs.push_images) && vars.YC_REGISTRY_ID != '' }}

jobs:
  build-push:
    name: образ · ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ml]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Сервисный аккаунт с ролью container-registry.images.pusher, авторизованный
      # ключ в JSON целиком лежит в секрете.
      - name: Логин в Yandex Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      # cr.yandex/<id реестра>/<service>
      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Yandex Container Registry не принимает индекс манифестов с аттестациями
          # ("Cannot read manifest data"), поэтому публикуем голый образ.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Посылка публикуется последней: когда ВМ её видит, образы сервисов с тем же
  # тегом sha-<коммит> уже лежат в реестре.
  bundle:
    name: посылка для стенда
    needs: build-push
    if: (github.event_name == 'push' || inputs.push_images) && vars.YC_REGISTRY_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Сервисный аккаунт с ролью container-registry.images.pusher, авторизованный
      # ключ в JSON целиком лежит в секрете.
      - name: Логин в Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      # Метка org.opencontainers.image.revision (полный sha коммита) — по ней ВМ
      # понимает, что посылка новая, и берёт теги образов.
      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/deploy
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/autodeploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Yandex Container Registry не принимает индекс манифестов с аттестациями
          # ("Cannot read manifest data"), поэтому публикуем голый образ.
          provenance: false
          sbom: false
