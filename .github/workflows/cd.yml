# ШАБЛОН деплоя. Хостинга пока нет, поэтому:
#   * автотриггеров нет — только ручной запуск (workflow_dispatch);
#   * job `build-push` рабочий: собирает и кладёт образы в GHCR;
#   * job `deploy` — каркас: включается переменной DEPLOY_ENABLED и заполняется
#     SSH/командами, когда поднимем хост. Пошагово — в deploy/README.md.
name: CD (шаблон)

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: Публиковать образы в GHCR
        type: boolean
        default: true
      tag:
        description: 'Доп. тег для образов (кроме sha и latest), например v0.1.0'
        type: string
        default: ''
  # Включить, когда деплой заработает: релиз по тегу v*.
  # push:
  #   tags: ['v*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: образ · ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR
        if: inputs.push_images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа приводится к нижнему регистру самим action:
      # refaxD/LCT-7 -> ghcr.io/refaxd/lct-7/<service>
      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: деплой на xxprod.ru
    needs: build-push
    runs-on: ubuntu-latest
    # Пока переменной DEPLOY_ENABLED нет (или она не 'true') — job пропускается,
    # и никто не видит «зелёный деплой», которого не было.
    # Включение: Settings -> Secrets and variables -> Actions -> Variables.
    if: vars.DEPLOY_ENABLED == 'true'
    # environment даёт ручное подтверждение и отдельный набор секретов.
    environment:
      name: prod
      url: https://xxprod.ru
    steps:
      - uses: actions/checkout@v4

      - name: Что нужно заполнить
        run: |
          echo "Каркас деплоя. Раскомментируйте один из вариантов ниже."
          echo "Образы уже в GHCR, тег: sha-$(git rev-parse --short HEAD)"
          exit 1

      # --------------------------------------------------------------------
      # ВАРИАНТ A (рекомендуемый для домашнего ПК за туннелем TUNA).
      # Self-hosted runner прямо на хосте: входящий SSH снаружи не нужен,
      # runner сам ходит на GitHub. Тогда у job'а: runs-on: [self-hosted, xxprod]
      # и всё делается локальными командами.
